      html.is-loading { overflow: hidden; }
      .pl { position: fixed; inset: 0; z-index: 100; --s: 1; --e: cubic-bezier(0.2, 0.8, 0.1, 1); font-family: 'Montserrat Variable', 'Helvetica Neue', Arial, sans-serif; }

      .pl__red, .pl__panel { position: absolute; inset: 0; transition: transform 0.95s cubic-bezier(0.76, 0, 0.18, 1); }

      .pl__panel { display: grid; place-items: center; overflow: hidden; background: #0c0c0d; color: #fff; }
      .pl.is-out { pointer-events: none; }
      .pl.is-out .pl__red, .pl.is-out .pl__panel { transform: translateY(-101%); }
      .pl.is-out .pl__stage { transform: translateY(18vh) scale(0.94); opacity: 0; }
      .pl__stage { position: relative; width: min(74vw, 620px); transition: transform 0.95s cubic-bezier(0.76, 0, 0.18, 1), opacity 0.5s; }
      .pl__logo { position: relative; display: block; width: 100%; height: auto; overflow: visible; }
      .pl__glow { position: absolute; inset: -70% -25%; background: radial-gradient(closest-side, rgba(255, 255, 255, 0.2), rgba(237, 28, 36, 0.14) 45%, transparent 72%); opacity: 0; animation: pl-fade calc(var(--s) * 1.1s) calc(var(--s) * 0.35s) forwards; }
      .pl__beam { position: absolute; top: 0; width: 30vmax; height: 150vmax; margin-left: -15vmax; transform-origin: 50% 0; background: linear-gradient(rgba(255, 255, 255, 0.5), rgba(255, 255, 255, 0.12) 45%, transparent 70%); clip-path: polygon(47% 0, 53% 0, 100% 100%, 0 100%); filter: blur(16px); opacity: 0; --a: 45deg; --a: atan2(50vw, 50vh); animation: pl-beam calc(var(--s) * 1.3s) var(--e) calc(var(--s) * 0.1s) forwards; }
      .pl__beam--l { left: 0; --to: calc(var(--a) * -1); --from: calc(var(--a) * -1 - 34deg); }
      .pl__beam--r { left: 100%; --to: var(--a); --from: calc(var(--a) + 34deg); animation-delay: calc(var(--s) * 0.22s); }
      .pl__mark, .pl__l { transform-box: fill-box; transform-origin: center; }
      .pl__mark { transform: scale(0) rotate(-140deg); animation: pl-mark calc(var(--s) * 0.9s) cubic-bezier(0.2, 1.25, 0.3, 1) calc(var(--s) * 0.3s) forwards; }
      .pl__l { opacity: 0; animation: pl-up calc(var(--s) * 0.7s) var(--e) forwards; }
      .pl__l--red { --y: 10px; animation-delay: calc(var(--s) * (0.72s + var(--i) * 0.07s)); }
      .pl__l--art { --y: 26px; animation-delay: calc(var(--s) * (0.92s + var(--i) * 0.09s)); }
      .pl__l--ev { --x: 12px; animation-delay: calc(var(--s) * (1.2s + var(--i) * 0.05s)); }
      .pl__foot { position: absolute; left: clamp(18px, 4vw, 56px); right: clamp(18px, 4vw, 56px); bottom: clamp(18px, 4vw, 44px); display: grid; grid-template-columns: auto 1fr auto; align-items: end; gap: 20px; font-size: 0.68rem; font-weight: 600; letter-spacing: 0.16em; text-transform: uppercase; color: rgba(255, 255, 255, 0.55); transition: opacity 0.3s; }
      .pl.is-out .pl__foot { opacity: 0; }
      .pl__n { min-width: 2.2ch; font-size: clamp(2.6rem, 7vw, 5.4rem); font-weight: 800; line-height: 0.8; letter-spacing: -0.05em; color: #fff; font-variant-numeric: tabular-nums; }
      .pl__bar { height: 2px; margin-bottom: 6px; background: rgba(255, 255, 255, 0.16); }
      .pl__bar i { display: block; height: 100%; background: #ed1c24; transform: scaleX(0); transform-origin: left; }
      @keyframes pl-fade { to { opacity: 1; } }
      @keyframes pl-beam { from { opacity: 0; transform: rotate(var(--from)); } to { opacity: 0.6; transform: rotate(var(--to)); } }
      @keyframes pl-mark { to { transform: none; } }
      @keyframes pl-up { from { opacity: 0; transform: translate(var(--x, 0), var(--y, 0)); } to { opacity: 1; transform: none; } }
      @media (prefers-reduced-motion: reduce) {
        .pl__beam { display: none; }
        .pl__mark, .pl__l { animation: none; opacity: 1; transform: none; }
        .pl__red, .pl__panel, .pl__stage { transition-duration: 0.01s; }
      }
      @media (max-width: 560px) { .pl__foot span:last-child { display: none; } }
    </style>

    <script>
      (function () {
        var el = document.getElementById('pl'), n = el.querySelector('.pl__n'), bar = el.querySelector('.pl__bar i')
        var fast = false
        try { fast = !!sessionStorage.getItem('redart:seen'); sessionStorage.setItem('redart:seen', '1') } catch (e) {}
        if (fast) el.classList.add('pl--fast')
        var min = fast ? 1150 : 2200, t0 = performance.now(), ready = false, v = 0
        function tick(now) {
          var t = Math.min(1, (now - t0) / min)
          // do 92% jedzie sam; setkę dostaje dopiero, gdy aplikacja i fonty są gotowe
          var target = ready && t >= 1 ? 100 : 92 * (1 - Math.pow(1 - t, 3))
          v += (target - v) * 0.16
          if (target === 100 && v > 99.5) v = 100
          n.textContent = (v < 10 ? '0' : '') + Math.round(v)
          bar.style.transform = 'scaleX(' + v / 100 + ')'
          if (v < 100) return requestAnimationFrame(tick)
          el.classList.add('is-out')
          document.documentElement.classList.remove('is-loading')
          setTimeout(function () { el.remove() }, 1400)
        }
        window.__appReady = function () { ready = true }
        setTimeout(window.__appReady, 8000) // nic nie może uwięzić użytkownika za zasłoną
        requestAnimationFrame(tick)
      })()
    </script>
